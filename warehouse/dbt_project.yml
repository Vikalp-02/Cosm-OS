name: cosmos
version: "0.1.0"
profile: cosmos

model-paths: [models]
macro-paths: [macros]
test-paths: [tests]
target-path: target
clean-targets: [target]

flags:
  send_anonymous_usage_stats: false

models:
  cosmos:
    # Staging only renames, so it stays a view over the raw files.
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

vars:
  # A city's missing sales count as a gap only if it reported on at least this
  # share of the previous `reporting_window_days`, with this much history.
  reporting_window_days: 28
  reporting_gap_min_history_days: 14
  reporting_gap_min_rate: 0.5
  # Days of sales that days-of-cover is measured against.
  cover_window_days: 7
