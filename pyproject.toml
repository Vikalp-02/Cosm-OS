[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cosmos"
version = "0.1.0"
description = "Root-cause investigation for quick-commerce revenue leaks"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/cosmos"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
